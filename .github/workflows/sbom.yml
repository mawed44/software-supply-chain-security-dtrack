name: CI et SBOM

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  DTRACK_HOSTNAME: ${{ secrets.DTRACK_HOSTNAME }}
  DTRACK_API_KEY: ${{ secrets.DTRACK_API_KEY }}
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  test:
    name: Test app
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  sbom:
    name: Generer et publier le SBOM
    needs: test
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Syft
        id: syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Generate bom.json with Syft
        shell: bash
        run: >-
          "${{ steps.syft.outputs.cmd }}" scan dir:.
          --source-name syft-sbom-demo
          --source-version "${GITHUB_SHA::12}"
          -o cyclonedx-json@1.6=bom.json

      - name: Upload SBOM as artifact
        uses: actions/upload-artifact@v4
        with:
          name: bom.cyclonedx.json
          path: bom.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish to Dependency-Track
        if: ${{ github.event_name != 'pull_request' && env.DTRACK_HOSTNAME != '' && env.DTRACK_API_KEY != '' }}
        env:
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
        uses: DependencyTrack/gh-upload-sbom@v3
        with:
          protocol: ${{ secrets.DTRACK_PROTOCOL || 'https' }}
          serverhostname: ${{ env.DTRACK_HOSTNAME }}
          port: ${{ secrets.DTRACK_PORT || '443' }}
          apikey: ${{ env.DTRACK_API_KEY }}
          projectname: syft-sbom-demo
          projectversion: ${{ github.ref_name }}
          projecttags: portfolio,syft,github-actions
          autocreate: true
          bomfilename: bom.json

      - name: Explain why publishing is skipped
        if: ${{ github.event_name != 'pull_request' && (env.DTRACK_HOSTNAME == '' || env.DTRACK_API_KEY == '') }}
        run: echo "::notice::SBOM generated, but not published. Configure DTRACK_HOSTNAME and DTRACK_API_KEY in GitHub secrets."
