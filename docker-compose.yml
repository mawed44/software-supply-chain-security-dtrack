volumes:
  dependency-track-data:

services:
  dtrack-apiserver:
    # La branche 4.14 conserve le mode H2 embarque, pratique pour cette demo locale.
    image: dependencytrack/apiserver:4.14.3
    container_name: dtrack-apiserver
    environment:
      ALPINE_DATABASE_MODE: embedded
    volumes:
      - dependency-track-data:/data
    restart: unless-stopped
    ports:
      - "8081:8080"

  dtrack-frontend:
    image: dependencytrack/frontend:4.14.3
    container_name: dtrack-frontend
    environment:
      API_BASE_URL: http://localhost:8081
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - dtrack-apiserver
